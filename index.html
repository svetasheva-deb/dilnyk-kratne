<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Дільники і кратні</title>

<style>
body { font-family: Arial; padding: 20px; }
.quiz-card { padding: 15px; border: 1px solid #ccc; margin-top: 10px; }
.option-btn { margin: 5px; padding: 8px; cursor: pointer; }
.correct { background: #4caf50; color: white; }
.wrong { background: #f44336; color: white; }
</style>
</head>

<body>

<h2>Квіз: дільники і кратні</h2>

<div>Питання: <span id="q-num">0</span></div>
<div>✔ Правильні: <span id="score-right">0</span></div>
<div>✖ Неправильні: <span id="score-wrong">0</span></div>

<div id="quiz-area"></div>

<script>
const rng = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

function getDivisors(n) {
  const d = [];
  for (let i = 1; i <= n; i++) if (n % i === 0) d.push(i);
  return d;
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

const MAX_N = 50;
const TOTAL_QUESTIONS = 10;

let current = 0;
let scoreRight = 0;
let scoreWrong = 0;
let currentQuestion = null;

function updateScoreUI() {
  const qNum = document.getElementById('q-num');
  const r = document.getElementById('score-right');
  const w = document.getElementById('score-wrong');

  if (!qNum || !r || !w) return;

  qNum.textContent = current;
  r.textContent = scoreRight;
  w.textContent = scoreWrong;
}

function generate() {
  const n = rng(5, MAX_N);
  const divs = getDivisors(n);

  const correct = divs[rng(0, divs.length - 1)];
  const options = shuffle([...divs, rng(1, MAX_N), rng(1, MAX_N)]);

  return { n, correct, options };
}

function render(q) {
  const area = document.getElementById('quiz-area');

  area.innerHTML = `
    <div class="quiz-card">
      <h3>Число: ${q.n}</h3>
      <div id="opts"></div>
      <div id="fb"></div>
      <button onclick="next()">Далі</button>
    </div>
  `;

  const opts = document.getElementById('opts');

  q.options.forEach(v => {
    const btn = document.createElement('button');
    btn.textContent = v;
    btn.className = 'option-btn';

    btn.onclick = () => {
      const fb = document.getElementById('fb');

      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

      if (v === q.correct) {
        btn.classList.add('correct');
        fb.textContent = '✔ правильно';
        scoreRight++;
      } else {
        btn.classList.add('wrong');
        fb.textContent = '✖ правильно: ' + q.correct;
        scoreWrong++;
      }

      updateScoreUI();
    };

    opts.appendChild(btn);
  });
}

function next() {
  if (current >= TOTAL_QUESTIONS) {
    document.getElementById('quiz-area').innerHTML =
      `<h2>Результат: ${scoreRight}/${TOTAL_QUESTIONS}</h2>`;
    return;
  }

  current++;
  currentQuestion = generate();
  render(currentQuestion);
  updateScoreUI();
}

window.addEventListener('DOMContentLoaded', () => {
  next();
});
</script>

</body>
</html>
