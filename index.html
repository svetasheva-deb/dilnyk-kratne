<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .input-field { margin: 10px 0; }
        input[type="text"], input[type="number"], input[type="email"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="checkbox"] { margin-right: 10px; }
    </style>
</head>
<body>
    <h1>Quiz Application</h1>
    <form id="quizForm">
        <div class="input-field">
            <label for="questionType">Select Question Type:</label>
            <select id="questionType" name="questionType">
                <option value="1">Type 1</option>
                <option value="2">Type 2</option>
                <option value="3">Type 3</option>
                <option value="4">Type 4</option>
                <option value="5">Type 5</option>
                <option value="6">Type 6</option>
            </select>
        </div>
        <div class="input-field" id="questionArea"></div>
        <button type="submit">Submit</button>
    </form>
    <script>
        document.getElementById('questionType').addEventListener('change', function() {
            const questionArea = document.getElementById('questionArea');
            questionArea.innerHTML = ''; // Clear previous question input
            const type = this.value;

            let inputField;
            switch(type) {
                case '1':
                    inputField = document.createElement('input');
                    inputField.type = 'text';
                    inputField.placeholder = 'Type 1 Question';
                    break;
                case '2':
                    inputField = document.createElement('input');
                    inputField.type = 'number';
                    inputField.placeholder = 'Type 2 Question';
                    break;
                case '3': // Fixed syntax error
                    inputField = document.createElement('input');
                    inputField.type = 'text';
                    inputField.placeholder = 'Type 3 Question';
                    break;
                case '4':
                    inputField = document.createElement('input');
                    inputField.type = 'email';
                    inputField.placeholder = 'Type 4 Question';
                    break;
                case '5':
                    inputField = document.createElement('input');
                    inputField.type = 'text';
                    inputField.placeholder = 'Type 5 Question';
                    inputField.required = true; // Proper input handling
                    break;
                case '6':
                    inputField = document.createElement('input');
                    inputField.type = 'text';
                    inputField.placeholder = 'Type 6 Question';
                    inputField.required = true; // Proper input handling
                    break;
                default:
                    break;
            }
            if (inputField) {
                inputField.classList.add('input-field');
                questionArea.appendChild(inputField);
            }
        });

        document.getElementById('quizForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Form submitted successfully!');
        });
    </script>
</body>
</html>
